<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <!-- Fundo Circular Tátil com Margem Limpa -->
  <rect width="64" height="64" rx="16" fill="#176B5B"/>
  
  <!-- Crista de Transferidor em Arco Marigold (Protractor Crest) -->
  <path d="M 18 25 C 20 15, 42 13, 48 23" fill="none" stroke="#F1AF32" stroke-width="3" stroke-linecap="round"/>
  <!-- Ticks milimetrados do transferidor -->
  <line x1="22" y1="18" x2="20" y2="14" stroke="#F1AF32" stroke-width="2" stroke-linecap="round"/>
  <line x1="30" y1="14" x2="30" y2="9" stroke="#F1AF32" stroke-width="2" stroke-linecap="round"/>
  <line x1="38" y1="14" x2="39" y2="9" stroke="#F1AF32" stroke-width="2" stroke-linecap="round"/>
  <line x1="45" y1="18" x2="48" y2="14" stroke="#F1AF32" stroke-width="2" stroke-linecap="round"/>

  <!-- Cabeça Geométrica do Prisma (Verdigris Suave / Creme) -->
  <path d="M 16 32 C 16 23, 26 21, 38 21 C 48 21, 54 27, 54 36 C 54 44, 46 50, 36 50 C 24 50, 16 43, 16 32 Z" fill="#378F79"/>
  
  <!-- Focinho / Mandíbula & Sorriso do Geômetra -->
  <path d="M 44 43 Q 49 43 53 38" fill="none" stroke="#1C2C27" stroke-width="2" stroke-linecap="round"/>
  <circle cx="51" cy="34" r="1.5" fill="#1C2C27"/>

  <!-- Olho Telescópico / Bússola Cônica (Turret Eye) -->
  <!-- Base do globo ocular -->
  <circle cx="33" cy="33" r="11" fill="#FFFDF6" stroke="#1C2C27" stroke-width="2.5"/>
  <!-- Íris de Marigold / Compasso -->
  <circle cx="34" cy="33" r="6.5" fill="#F1AF32"/>
  <!-- Pupila de Nanquim Focada -->
  <circle cx="35" cy="33" r="3.8" fill="#1C2C27"/>
  <!-- Brilho de Eureka (Catchlight) -->
  <circle cx="33" cy="31" r="1.5" fill="#FFFFFF"/>

  <!-- Detalhe do Pequeno Esquadro Âmbar Flutuante -->
  <polygon points="12,48 18,39 18,48" fill="#F1AF32" opacity="0.9" stroke="#1C2C27" stroke-width="1.2" stroke-linejoin="round"/>
</svg>
