<?xml version="1.0" encoding="UTF-8"?>
<svg version="1.1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <radialGradient id="amberGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFE082"/>
      <stop offset="100%" stop-color="#F1AF32"/>
    </radialGradient>
  </defs>

  <!-- 1. TAIL GROUP (Back-most) -->
  <g id="Tail">
    <!-- Golden Spiral Tail -->
    <path id="TailSpiral" d="M 380 620 C 310 650 210 620 180 720 C 150 810 240 890 330 870 C 400 850 420 770 380 730 C 350 700 300 720 310 755 C 315 770 335 775 345 765" 
          fill="none" stroke="#203734" stroke-width="46" stroke-linecap="round" stroke-linejoin="round"/>
    <path id="TailSpiralInner" d="M 380 620 C 310 650 210 620 180 720 C 150 810 240 890 330 870 C 400 850 420 770 380 730 C 350 700 300 720 310 755 C 315 770 335 775 345 765" 
          fill="none" stroke="#378E79" stroke-width="32" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- 2. BODY GROUP (Torso and Back Flank) -->
  <g id="Body">
    <!-- Lower back and flank -->
    <path id="BodyTorso" d="M 360 520 C 340 600 380 700 460 760 C 530 810 640 800 700 740 C 750 690 760 600 740 520 C 720 440 660 380 580 370 C 480 360 390 420 360 520 Z" 
          fill="#203734" stroke="#162421" stroke-width="8"/>
    <!-- Torso highlight curve (Teal gradient band) -->
    <path id="TorsoHighlight" d="M 400 520 C 380 580 410 670 480 720 C 540 760 630 750 670 700 C 650 620 620 540 560 480 C 500 420 430 450 400 520 Z" 
          fill="#378E79" opacity="0.6"/>
  </g>

  <!-- 3. HEAD GROUP (Crest, Head Base, Scleras, Pupils) -->
  <g id="Head">
    <!-- 3A. Protractor Crest (Arco graduado de 180° no topo da cabeça) -->
    <g id="ProtractorCrest">
      <!-- Crest Outer Arch -->
      <path id="CrestArch" d="M 460 320 C 460 210 560 130 680 130 C 740 130 800 160 840 210 C 820 250 780 290 740 310 C 660 280 540 290 460 320 Z" 
            fill="#F1AF32" stroke="#FFE082" stroke-width="6"/>
      <!-- Crest Radials (Graduações matemáticas) -->
      <line x1="620" y1="200" x2="600" y2="160" stroke="#203734" stroke-width="4" stroke-linecap="round"/>
      <line x1="680" y1="190" x2="680" y2="140" stroke="#203734" stroke-width="4" stroke-linecap="round"/>
      <line x1="740" y1="200" x2="760" y2="160" stroke="#203734" stroke-width="4" stroke-linecap="round"/>
      <line x1="790" y1="225" x2="820" y2="195" stroke="#203734" stroke-width="4" stroke-linecap="round"/>
    </g>

    <!-- 3B. Head Base -->
    <path id="HeadBase" d="M 460 360 C 440 430 480 500 560 520 C 650 540 760 500 790 420 C 810 360 780 300 720 280 C 640 250 500 280 460 360 Z" 
          fill="#203734" stroke="#162421" stroke-width="6"/>

    <!-- 3C. Left Eye (Turret traseiro peeking) -->
    <g id="LeftEye">
      <ellipse id="LeftSocket" cx="535" cy="335" rx="45" ry="45" fill="#203734" stroke="#378E79" stroke-width="5"/>
      <ellipse id="LeftSclera" cx="535" cy="335" rx="35" ry="35" fill="#FFFDF6"/>
      <g id="LeftPupil">
        <ellipse id="LeftIris" cx="538" cy="335" rx="22" ry="22" fill="#F1AF32"/>
        <ellipse id="LeftPupilDisc" cx="540" cy="335" rx="14" ry="14" fill="#1C2C27"/>
        <circle id="LeftGleam" cx="544" cy="330" r="5" fill="#FFFFFF"/>
      </g>
    </g>

    <!-- 3D. Right Eye (Turret frontal proeminente) -->
    <g id="RightEye">
      <ellipse id="RightSocket" cx="755" cy="325" rx="55" ry="55" fill="#203734" stroke="#378E79" stroke-width="6"/>
      <ellipse id="RightSclera" cx="755" cy="325" rx="44" ry="44" fill="#FFFDF6"/>
      <g id="RightPupil">
        <ellipse id="RightIris" cx="758" cy="325" rx="28" ry="28" fill="#F1AF32"/>
        <ellipse id="RightPupilDisc" cx="760" cy="325" rx="17" ry="17" fill="#1C2C27"/>
        <circle id="RightGleamMain" cx="765" cy="319" r="7" fill="#FFFFFF"/>
        <circle id="RightGleamSub" cx="755" cy="332" r="3.5" fill="#FFFFFF"/>
      </g>
    </g>

    <!-- 3E. Playful Smile / Chin -->
    <path id="Mouth" d="M 660 480 Q 710 495 745 470" fill="none" stroke="#162421" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- 4. ARM GROUP (Shoulder, Arm, Set Square, Paw) -->
  <g id="Arm">
    <!-- Upper Arm &amp; Forearm -->
    <path id="ArmLimb" d="M 740 520 C 780 550 830 580 850 630 C 865 670 850 710 820 730 C 790 750 760 740 745 710 C 730 670 730 620 710 570 Z" 
          fill="#203734" stroke="#162421" stroke-width="6" stroke-linejoin="round"/>

    <!-- Set Square 30°-60°-90° (Esquadro de acrílico ambarino translúcido) -->
    <g id="SetSquare">
      <!-- Outer Triangle (Base=120, Height=190) -->
      <polygon id="SquareOuter" points="780,540 940,760 780,760" 
               fill="url(#amberGlow)" fill-opacity="0.9" stroke="#FFFFDF" stroke-width="7" stroke-linejoin="round"/>
      <!-- Inner Cutout Triangle -->
      <polygon id="SquareInnerHole" points="805,600 895,730 805,730" 
               fill="#203734" stroke="#FFE082" stroke-width="3" stroke-linejoin="round"/>
      <!-- Millimeter markings on hypotenuse -->
      <line x1="815" y1="590" x2="825" y2="582" stroke="#203734" stroke-width="3"/>
      <line x1="845" y1="630" x2="855" y2="622" stroke="#203734" stroke-width="3"/>
      <line x1="875" y1="670" x2="885" y2="662" stroke="#203734" stroke-width="3"/>
      <line x1="905" y1="710" x2="915" y2="702" stroke="#203734" stroke-width="3"/>
    </g>

    <!-- Front Paw gripping the Square -->
    <ellipse id="FrontPaw" cx="785" cy="660" rx="22" ry="16" fill="#203734" stroke="#162421" stroke-width="4" transform="rotate(-15 785 660)"/>
  </g>

  <!-- 5. ANCHOR PROPS GROUP (Decoupled Orbit &amp; 3D Question Mark) -->
  <g id="Anchor_HeadTop" transform="translate(700, 100)">
    <!-- Question Mark Prop (Gold 3D) -->
    <g id="QuestionMarkProp">
      <path d="M 0 -20 C -20 -20 -30 0 -20 20 C -10 35 5 35 5 55" fill="none" stroke="#F1AF32" stroke-width="16" stroke-linecap="round"/>
      <circle cx="5" cy="80" r="9" fill="#F1AF32"/>
      <path d="M 0 -20 C -20 -20 -30 0 -20 20 C -10 35 5 35 5 55" fill="none" stroke="#FFE082" stroke-width="8" stroke-linecap="round"/>
      <circle cx="5" cy="80" r="4.5" fill="#FFE082"/>
    </g>
  </g>
</svg>
