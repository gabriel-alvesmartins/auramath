<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Auramath | Não calcule. Veja.</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700;800&family=Plus+Jakarta+Sans:wght@600;700;800;900&display=swap" rel="stylesheet">
    <style>
      :root {
        --color-bg: #F7F4EA;
        --color-card: #FFFDF6;
        --color-paper: #F7F4EA;
        --color-cream: #FFFDF6;
        --color-ink: #202522;
        --color-verdigris: #176B5B;
        --color-marigold: #F2B84B;
        --color-coral: #E76F61;
        --color-iris: #6E5AA6;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        -webkit-tap-highlight-color: transparent;
      }
      body {
        background-color: #F7F4EA;
        color: #202522;
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        overflow-x: hidden;
        min-height: 100vh;
        user-select: none;
      }
      .font-mono {
        font-family: 'JetBrains Mono', monospace;
        font-variant-numeric: tabular-nums;
      }
      .font-display {
        font-family: 'Plus Jakarta Sans', sans-serif;
      }
      /* Custom scrollbars */
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: #F7F4EA;
      }
      ::-webkit-scrollbar-thumb {
        background: #D9D5C8;
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #C2BDAE;
      }
      @keyframes float {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-8px); }
      }
      .animate-float {
        animation: float 3s ease-in-out infinite;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
